<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pixideus | World of Warcraft Housing</title>

<meta name="description" content="Pixideus - World of Warcraft Housing creations">

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>


<body>


<!-- =========================
     BANNER
========================= -->


<header class="hero">

<img src="banner.jpg" class="banner" alt="Pixideus">

<div class="hero-overlay"></div>

</header>





<!-- =========================
     CREATIONS
========================= -->


<main>


<section class="creations" id="creations">


<div class="section-title">

<h1>My Worlds</h1>

<p>
Discover my World of Warcraft housing creations.
</p>

</div>





<!-- FILTERS -->


<div class="filters">


<button class="filter active" data-filter="all">
All
</button>


<button class="filter" data-filter="interior">
Interiors
</button>


<button class="filter" data-filter="exterior">
Exteriors
</button>


<button class="filter" data-filter="fantasy">
Fantasy
</button>


<button class="filter" data-filter="gothic">
Gothic
</button>


<button class="filter" data-filter="legacy">
Legacy
</button>


</div>





<!-- BUILDS WILL APPEAR HERE -->


<div class="gallery" id="gallery">


</div>



</section>


</main>






<!-- =========================
     BUILD MODAL
========================= -->


<div class="modal" id="modal">


<div class="modal-content">


<button class="close" id="closeModal">
×
</button>




<div class="modal-gallery">


<button class="gallery-arrow left" id="previousImage">
❮
</button>


<img id="modalImage" src="" alt="">


<button class="gallery-arrow right" id="nextImage">
❯
</button>


</div>





<div class="modal-info">


<h2 id="modalTitle">
</h2>


<p id="modalDescription">
</p>



<div class="video-wrapper">


<iframe
id="modalVideo"
src=""
allowfullscreen>
</iframe>


</div>



</div>



</div>


</div>






<script src="builds.js"></script>

<script src="script.js"></script>


</body>

</html>
