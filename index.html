<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Pixideus - WoW Housing</title>

<style>
body{
    background:#1b1b1b;
    color:white;
    font-family:Arial;
    margin:0;
}

header{
    background:#4b2b68;
    padding:40px;
    text-align:center;
}

h1{
    margin:0;
    font-size:48px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:25px;
    padding:30px;
}

.card{
    background:#2b2b2b;
    border-radius:12px;
    overflow:hidden;
    transition:.25s;
}

.card:hover{
    transform:scale(1.03);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card h2{
    margin:15px;
}

.card p{
    margin:15px;
    color:#cccccc;
}
</style>

</head>

<body>

<header>
<h1>Pixideus Housing</h1>
<p>World of Warcraft Blueprints</p>
</header>

<div class="gallery">

<div class="card">
<img src="https://picsum.photos/600/400" alt="">
<h2>Babylone</h2>
<p>🏛️ Oriental • Jardin • Blueprint</p>
</div>

<div class="card">
<img src="https://picsum.photos/601/400" alt="">
<h2>Santorin</h2>
<p>🇬🇷 Maison • Blueprint</p>
</div>

</div>

</body>
</html>
