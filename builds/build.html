<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hanging Gardens of Babylon - Pixideus</title>

</head>


<body>


<!-- ========================= -->
<!-- Image Carousel             -->
<!-- ========================= -->
<div class="image-viewer test-viewer">

    <div class="carousel-box">

        <span class="close-viewer">
            ×
        </span>

        <button class="prev-image">
            ❮
        </button>

        <img src="" alt="Large preview">

        <button class="next-image">
            ❯
        </button>

    </div>

</div>


<!-- ========================= -->
<!-- Header                    -->
<!-- ========================= -->

<header class="header-area">

    <div class="site-container">

        <nav class="main-nav">

            <a href="../index.html" class="logo">
                <img src="../images/logo.png"
                     alt="Pixideus">
            </a>


            <ul class="nav">

                <li>
                    <a href="../index.html#builds" class="active">
                        My Builds
                    </a>
                </li>

                <li>
                    <a href="../index.html#legacy">
                        Old Builds
                    </a>
                </li>

                <li>
                    <a href="../index.html#about">
                        About Me
                    </a>
                </li>

                <li>
                    <a href="../index.html#contact">
                        Contact Me
                    </a>
                </li>

            </ul>

        </nav>

    </div>

</header>


<!-- ========================= -->
<!-- Build Page                -->
<!-- ========================= -->

<section class="build-page">

    <div class="container">


        <!-- ========================= -->
        <!-- Breadcrumb                -->
        <!-- ========================= -->

      <div class="breadcrumb">

    <a href="../index.html#builds">
        My Builds
    </a>

    <span>></span>

    <span id="breadcrumb-title"></span>

</div>



        <div class="build-intro">


            <!-- LEFT COLUMN -->

            <div class="build-info">


                <h1 id="build-title"></h1>


                <p class="build-description" id="build-description"></p>


                <p class="build-room">
    <strong>Room:</strong>
    <span id="build-room"></span>
</p>


                <!-- ========================= -->
                <!-- Mini Gallery              -->
                <!-- ========================= -->

                <div class="build-gallery">


                    <img src="../images/Babylon/babylon1-small.jpg"
                        data-full="../images/Babylon/babylon1.jpg"
                         alt="Hanging Gardens of Babylon"
                         loading="lazy">


                    <img src="../images/Babylon/babylon2-small.jpg"
                        data-full="../images/Babylon/babylon2.jpg"
                         alt="Hanging Gardens of Babylon"
                         loading="lazy">


                    <img src="../images/Babylon/babylon3-small.jpg"
                        data-full="../images/Babylon/babylon3.jpg"
                         alt="Hanging Gardens of Babylon"
                         loading="lazy">


                    <img src="../images/Babylon/babylon4-small.jpg"
                        data-full="../images/Babylon/babylon4.jpg"
                         alt="Hanging Gardens of Babylon"
                         loading="lazy">


                    <img src="../images/Babylon/babylon5-small.jpg"
                        data-full="../images/Babylon/babylon5.jpg"
                         alt="Hanging Gardens of Babylon"
                         loading="lazy">


                    <img src="../images/Babylon/babylon6-small.jpg"
                        data-full="../images/Babylon/babylon6.jpg"
                         alt="Hanging Gardens of Babylon"
                         loading="lazy">


                </div>


            </div>



            <!-- RIGHT COLUMN -->

          <div class="video-container">

    <iframe
        id="build-video"
        src=""
        title=""
        frameborder="0"
        allowfullscreen>
    </iframe>

</div>


        </div>


    </div>


</section>
<script src="../script.js"></script>

</html>
